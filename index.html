<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CA Youth Parliament — Виртуальный Координатор</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg overflow-hidden flex flex-col h-[90vh]">
    <header class="bg-sky-900 text-white p-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-sky-700 flex items-center justify-center font-bold text-lg">🏛</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">CA Youth Parliament</h1>
          <p class="text-xs text-sky-200">Виртуальный координатор и ИИ-ассистент</p>
        </div>
      </div>
      <button id="toggleConfigBtn" class="text-xs bg-sky-800 hover:bg-sky-700 px-3 py-1.5 rounded transition">
        ⚙️ Настройки API
      </button>
    </header>

    <div id="configPanel" class="hidden bg-slate-50 p-4 border-b border-slate-200 text-sm space-y-3">
      <h3 class="font-semibold text-slate-700">Настройки подключения</h3>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">API Key</label>
        <input type="password" id="openaiKeyInput" placeholder="Вставьте ваш API Key" class="w-full p-2 border rounded text-xs" />
      </div>
      <button id="saveConfigBtn" class="w-full bg-sky-600 text-white py-1.5 rounded text-xs font-semibold hover:bg-sky-700">
        Сохранить настройки
      </button>
    </div>

    <main id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm bg-slate-50">
      <div class="flex items-start space-x-2">
        <div class="bg-white border border-slate-200 p-3 rounded-lg shadow-sm max-w-[85%]">
          <p class="font-semibold text-sky-900 mb-1">Ассистент Оргкомитета</p>
          <p>Приветствуем вас, уважаемый делегат!</p>
          <p class="mt-2">Я — официальный ИИ-ассистент <b>CA Youth Parliament</b>. Готов проконсультировать вас по расписанию, регламенту, спикерам и площадкам.</p>
        </div>
      </div>
    </main>

    <footer class="p-3 bg-white border-t border-slate-200">
      <form id="chatForm" class="flex gap-2">
        <input
          type="text"
          id="userInput"
          placeholder="Задайте вопрос о мероприятии..."
          class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm"
          required
        />
        <button
          type="submit"
          id="sendBtn"
          class="bg-sky-900 hover:bg-sky-800 text-white px-5 py-2 rounded-lg font-medium transition text-sm flex items-center justify-center"
        >
          Отправить
        </button>
      </form>
    </footer>
  </div>

  <script>
    const SYSTEM_PROMPT = `
Ты — официальный виртуальный координатор и интеллектуальный ассистент CA Youth Parliament (Молодежного Парламента Центральной Азии).

ТВОЯ РОЛЬ И ТОН:
- Вдохновляющий, дружелюбный, поддерживающий и уважительно-деловой тон.
- Обращайся к пользователям: «Уважаемый делегат» или «Уважаемый коллега».
- Приветствуй участников с теплотой и воодушевлением, подчёркивай их потенциал и амбиции.
- Будь лаконичен, структурируй ответы (используй списки и абзацы).

МИССИЯ И ЦЕЛЬ ОРГАНИЗАЦИИ:
- **Зачем создан CA Youth Parliament**: Организация создана для того, чтобы помогать молодой и амбициозной молодёжи реализовывать свои идеи, проекты и инициативы, а также непрерывно развиваться в ключевых сферах будущего.
- **Мотивация участников**: Мы верим, что великие результаты достигаются в сильном и единомышленном окружении. Если делегат стремится к росту, видит в себе потенциал и хочет менять регион к лучшему — CA Youth Parliament именно то окружение, где его амбиции найдут поддержку, ресурсы и единомышленников, похожих на него!

ГРАНИЦЫ И ОГРАНИЧЕНИЯ:
1. Отвечай ТОЛЬКО на вопросы о миссии, структуре, проектах, курсах, членстве и департаментах CA Youth Parliament.
2. Категорически запрещено обсуждать политические споры, религиозные темы или бытовые вопросы.
3. Запрещено придумывать (галлюцинировать) даты предстоящих ивентов. Если спрашивают про расписание ближайшего ивента, отвечай, что анонс и дата будут объявлены позже.
4. При любых сложных, специфических вопросах или если тема требует индивидуального рассмотрения, отвечай максимально сглаженно и вежливо:
   «Спасибо за ваш вопрос! Чтобы вы получили максимально точную и подробную информацию по этому поводу, я переадресую вас к нашему координатору, который с радостью ответит на все ваши вопросы:
   • Telegram: @mmadybekovaa
   • Телефон: +7 777 081 5921»

==================================================
БАЗА ЗНАНИЙ CA YOUTH PARLIAMENT:
==================================================

🎯 Развитие в 6 ключевых сферах будущего Центральной Азии:
Мы предоставляем развитие и практическую платформу в 6 важнейших направлениях, в каждом из которых функционирует соответствующий департамент:
1. **Международные Отношения** — организация дипломатических симуляций, изучение международной политики, дипломатического этикета и межгосударственного сотрудничества.
2. **Экология** — разработка экологических инициатив, проектов по устойчивому развитию и защите окружающей среды Центральной Азии.
3. **Медиа** — создание контента, продвижение ценностей организации, SMM, работа с фото- и видеоматериалами.
4. **Журналистика** — написание аналитических статей, интервью, освещение событий Парламента и развитие навыков публицистики.
5. **Бизнес** — развитие предпринимательского мышления, стартап-инициатив, финансовой грамотности и нетворкинга.
6. **Образование** — организация обучающих программ, воркшопов, академических дискуссий и развивающих курсов.

📚 Развивающие курсы (бесплатно для мемберов/участников):
- Языковые курсы: Английский язык, Турецкий язык, Французский язык.
- Central Asian Youth Academy: Интеллектуальная площадка с лекциями от государственных служащих и действующих дипломатов.

📍 Адрес офиса:
- г. Алматы, ул. Байтурсынова 22/к1, 3 этаж (справа).

🌎 География проекта:
- Парламент уже официально функционирует в Кыргызстане и Узбекистане.
- Мы активно рассматриваем кандидатов из Таджикистана и Туркменистана.

💡 Инициативы и собственные проекты делегатов:
- Если у делегата/участника есть собственные проекты или идеи, которые он хочет воплотить в жизнь, с вдохновением направляй его к координатору проекта:
  • Telegram / Username: @mmadybekovaa
  • Телефон: +7 777 081 5921
`;

    const configPanel = document.getElementById("configPanel");
    const toggleConfigBtn = document.getElementById("toggleConfigBtn");
    const saveConfigBtn = document.getElementById("saveConfigBtn");
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const openaiKeyInput = document.getElementById("openaiKeyInput");

    openaiKeyInput.value = localStorage.getItem("OPENAI_API_KEY") || "";

    toggleConfigBtn.addEventListener("click", () => {
      configPanel.classList.toggle("hidden");
    });

    saveConfigBtn.addEventListener("click", () => {
      localStorage.setItem("OPENAI_API_KEY", openaiKeyInput.value.trim());
      configPanel.classList.add("hidden");
      alert("Настройки сохранены!");
    });

    function appendMessage(sender, text, isError = false) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `flex items-start space-x-2 ${sender === "user" ? "justify-end" : "justify-start"}`;

      const innerDiv = document.createElement("div");
      innerDiv.className = `p-3 rounded-lg shadow-sm max-w-[85%] ${
        sender === "user"
          ? "bg-sky-900 text-white"
          : isError
          ? "bg-red-50 border border-red-200 text-red-700"
          : "bg-white border border-slate-200 text-slate-800"
      }`;

      innerDiv.innerHTML = text.replace(/\n/g, "<br>");
      msgDiv.appendChild(innerDiv);
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendChatRequest(promptText, apiKey) {
      // Использование рабочего публичного прокси-маршрута
      const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://api.openai.com/v1/chat/completions");

      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: promptText }
          ],
          temperature: 0.3
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `Статус ошибки: ${response.status}`);
      }

      const data = await response.json();
      return data.choices[0].message.content;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      const apiKey = localStorage.getItem("OPENAI_API_KEY") || openaiKeyInput.value.trim();

      if (!apiKey) {
        appendMessage("assistant", "⚠️ Укажите API Key в настройках (⚙️).", true);
        return;
      }

      appendMessage("user", text);
      userInput.value = "";
      sendBtn.disabled = true;
      sendBtn.textContent = "Думаю...";

      try {
        const reply = await sendChatRequest(text, apiKey);
        appendMessage("assistant", reply);
      } catch (error) {
        appendMessage("assistant", `❌ Ошибка запроса: ${error.message}\n\nУбедитесь, что включен VPN или проверьте валидность API ключа.`, true);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Отправить";
      }
    });
  </script>
</body>
</html>
